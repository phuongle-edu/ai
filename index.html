<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuong Birmingham | Learning Commons Specialist 2</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f4f6f9;
            --text-dark: #333333;
            --text-light: #666666;
            --white: #ffffff;
            --accent-color: #e67e22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--secondary-color);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 35px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .profile-img-placeholder {
            width: 120px;
            height: 120px;
            background-color: #e1e7ed;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: #a0aec0;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .institution {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 25px;
            font-style: italic;
        }

        .interactive-section {
            margin: 20px 0;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        #greeting {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
            height: 24px;
        }

        .nav-links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background-color: #004085;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img-placeholder">👤</div>
        <h1>Phuong Birmingham</h1>
        <div class="title">Learning Commons Specialist 2</div>
        <div class="institution">Tarrant County College</div>
        
        <div class="interactive-section">
            <div id="greeting">Loading greeting...</div>
            <p style="font-size: 0.9rem; color: var(--text-light);">Welcome to my professional academic space.</p>
        </div>

        <div class="nav-links">
            <a href="writing.html" class="btn">View My Writing Portfolio</a>
            <a href="lesson.html" class="btn btn-secondary">Access Lesson Plans</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const greetingElement = document.getElementById('greeting');
            const hour = new Date().getHours();
            let greetingText = '';

            if (hour < 12) {
                greetingText = 'Good morning!';
            } else if (hour < 17) {
                greetingText = 'Good afternoon!';
            } else {
                greetingText = 'Good evening!';
            }

            greetingElement.textContent = greetingText;
        });
    </script>

</body>
</html>
